<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EnsariPOS Kiosk</title>
<style>
/* QR Menü kalitesinde kiosk teması: sıcak krem zemin, marka başlık, altın vurgu,
   görselde fiyat etiketi, yumuşak gölgeler. --accent/--bg vb. admin temasıyla değişir. */
:root{
  --accent:#3498db; --accent2:#5faee3; --accent-d:#2c6fa0;
  --bg:#faf6ee; --card:#ffffff; --tx:#2a1c14; --tx2:#8a7a68; --line:#ece3d4;
  --gold:#c9a227; --gold-d:#a8841c; --ok:#1e9e5a;
  --shadow:0 6px 18px rgba(0,0,0,.08); --shadow-l:0 16px 40px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif}
html{height:100%;background:var(--bg)}
body{height:100%;overflow:hidden;color:var(--tx);user-select:none;background:var(--bg);background:radial-gradient(ellipse at top,color-mix(in srgb,var(--accent) 13%,var(--bg)) 0%,var(--bg) 60%)}
img{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ---------- SPLASH ---------- */
#splash{background:linear-gradient(145deg,var(--accent),var(--accent-d));color:#fff;align-items:center;justify-content:center;text-align:center;position:fixed;inset:0}
.splashmid{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;background:#fff;border-radius:34px;padding:46px 60px;box-shadow:0 30px 80px rgba(0,0,0,.32)}
#splash .logo{max-width:300px;max-height:220px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12))}
#splash .biz{font-size:46px;font-weight:900;letter-spacing:-.5px;color:var(--accent);background:linear-gradient(135deg,var(--accent),var(--accent-d));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#splash .tap{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:3;display:inline-flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2a1c14;font-size:26px;font-weight:800;padding:16px 38px;border-radius:999px;box-shadow:0 12px 34px rgba(201,162,39,.55);animation:pulse 1.8s ease-in-out infinite}
#splash .hand{font-size:32px;display:inline;margin:0}
.slider{position:absolute;inset:0;z-index:0;overflow:hidden}
.slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease}
.slider img.on{opacity:1}
#splash.hasslider .splashmid{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92)}
#splash.hasslider .splashmid .logo{max-height:110px}
#splash.hasslider .tap{bottom:56px}
#splash.hasslider:after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,0) 45%)}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);box-shadow:0 12px 34px rgba(201,162,39,.5)}50%{transform:translateX(-50%) scale(1.05);box-shadow:0 16px 44px rgba(201,162,39,.8)}}
.langbar{position:fixed;top:22px;right:22px;display:flex;gap:10px;z-index:30}
.langbar img{width:50px;height:34px;border-radius:7px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.55;border:3px solid transparent}
.langbar img.on{opacity:1;border-color:#fff}

/* ---------- Common header ---------- */
.hd{display:flex;align-items:center;gap:14px;padding:16px 26px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;flex:0 0 auto;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:5}
.hd .blogo{height:44px;max-width:150px;object-fit:contain;background:#fff;border-radius:10px;padding:3px 7px}
.hd .bname{font-size:23px;font-weight:900;color:#fff}
.hd .sp{flex:1}
.back{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:#fff;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.2)}

/* ---------- Order type / menu select ---------- */
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:42px}
.mid h2{font-size:38px;font-weight:900;text-align:center;color:var(--tx)}
.cards{display:flex;gap:38px;flex-wrap:wrap;justify-content:center}
.otcard{width:310px;height:350px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;border:2px solid var(--line);transition:transform .14s,box-shadow .14s}
.otcard:active{transform:scale(.96)}
.otcard:hover{box-shadow:var(--shadow-l);border-color:var(--gold)}
.otcard img{width:140px;height:140px;object-fit:contain}
.otcard .emoji{font-size:120px;line-height:1}
.otcard .lbl{font-size:32px;font-weight:800;color:var(--tx)}

/* ---------- Menu ---------- */
/* Kategoriler ÜSTTE, SambaPOS'taki gibi renkli butonlar (renk SambaPOS menüsünden gelir) */
.mbody{flex:1;display:flex;flex-direction:column;min-height:0}
.cats{flex:0 0 auto;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.05);scrollbar-width:none;z-index:2}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;min-width:136px;height:96px;padding:10px 16px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#f6efe2;color:var(--tx);font-size:16.5px;font-weight:800;text-align:center;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.07);transition:transform .14s,box-shadow .14s}
.cat .ci{font-size:32px;line-height:1}
.cat .cn{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.colored .ci{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.cat.on{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.18)}
.cat:not(.colored).on{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff}
.cat.feat{background:linear-gradient(135deg,#f7dc7a,var(--gold));color:#2a1c14}
.prods{flex:1;overflow-y:auto;padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:20px;align-content:start}
.pcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .14s,box-shadow .14s}
.pcard:active{transform:scale(.97)}
.pcard:hover{box-shadow:var(--shadow-l)}
.pimgwrap{position:relative;width:100%;height:160px;background:linear-gradient(135deg,#f6ecd9,#ecdcb8)}
.pimgwrap .pimg{width:100%;height:100%;object-fit:cover}
.pph{width:100%;height:100%;display:grid;place-items:center;font-size:68px;background:radial-gradient(circle at 50% 40%,#fff7e8 0%,#f3e3c3 70%,#ead6ad 100%)}
.ptag{position:absolute;left:0;bottom:0;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;font-weight:900;font-size:17px;padding:7px 15px;border-top-right-radius:14px;box-shadow:0 -2px 10px rgba(0,0,0,.18);letter-spacing:.2px}
.padd{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2a1c14;font-size:30px;font-weight:800;display:grid;place-items:center;box-shadow:0 5px 16px rgba(201,162,39,.55)}
.pb{padding:13px 15px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-size:18px;font-weight:800;line-height:1.25;color:var(--tx)}
.pd{font-size:13.5px;color:var(--tx2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;color:var(--tx2);font-size:22px;padding:80px 20px}

/* ---------- Cart bar ---------- */
.cartbar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:15px 26px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.07)}
.cartbar .cinfo{font-size:16px;font-weight:700;color:var(--tx2)}
.cartbar .ctot{font-size:30px;font-weight:900;color:var(--tx)}
.cartbar .sp{flex:1}
.bigbtn{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2a1c14;font-size:23px;font-weight:800;padding:17px 40px;border-radius:999px;box-shadow:0 10px 26px rgba(201,162,39,.45)}
.bigbtn:active{transform:scale(.97)}
.bigbtn.ghost{background:var(--card);color:var(--tx);box-shadow:none;border:2px solid var(--line)}
.bigbtn[disabled]{opacity:.4;box-shadow:none}

/* ---------- Modal (product detail / cart / keypad) ---------- */
.ov{position:fixed;inset:0;background:rgba(42,28,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;border-radius:30px 30px 0 0;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet.center{border-radius:28px;margin:auto}
#pd .pdimg{width:100%;height:300px;object-fit:cover;background:linear-gradient(135deg,#f6ecd9,#ecdcb8)}
.pdbody{padding:24px 26px 26px}
#pd .pdn{font-size:30px;font-weight:900;color:var(--tx)}
#pd .pdd{font-size:18px;color:var(--tx2);margin-top:10px;line-height:1.5}
#pd .pdp{font-size:32px;font-weight:900;color:var(--gold-d);margin-top:14px}
.allerg{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.allerg img{width:46px;height:46px}
.qtyrow{display:flex;align-items:center;gap:22px;margin:24px 0}
.qbtn{width:60px;height:60px;border-radius:16px;background:#f6efe2;color:var(--tx);font-size:36px;font-weight:700;display:grid;place-items:center}
.qval{font-size:34px;font-weight:900;min-width:50px;text-align:center}
#cart .clist{padding:10px 24px}
.cr{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.cr .crn{flex:1;font-size:20px;font-weight:700;color:var(--tx)}
.cr .crp{font-size:19px;font-weight:800;min-width:90px;text-align:right;color:var(--gold-d)}
.cr .q{display:flex;align-items:center;gap:12px}
.cr .q button{width:42px;height:42px;border-radius:12px;background:#f6efe2;font-size:26px;font-weight:700}
.cr .q span{font-size:22px;font-weight:800;min-width:30px;text-align:center}
.sumrow{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;font-size:28px;font-weight:900;border-top:2px solid var(--line);color:var(--tx)}
.sheethd{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 6px}
.sheethd h3{font-size:26px;font-weight:900;color:var(--tx)}
.closex{font-size:32px;color:var(--tx2);width:48px;height:48px;border-radius:50%;background:#f6efe2;display:grid;place-items:center}
.sheetfoot{padding:18px 24px 26px;display:flex;gap:14px}
.sheetfoot .bigbtn{flex:1;text-align:center}
#kp .kphead{text-align:center;padding:26px 20px 6px;font-size:26px;font-weight:900;color:var(--tx)}
#kp .kpval{text-align:center;font-size:56px;font-weight:900;color:var(--accent);min-height:70px;letter-spacing:4px}
.kpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 26px}
.kpgrid button{height:76px;border-radius:18px;background:#f6efe2;font-size:34px;font-weight:800;color:var(--tx)}
.kpgrid button:active{background:var(--line)}
.tpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:16px 24px 26px;max-height:72vh;overflow:auto}
.tpbtn{padding:22px 10px;border-radius:16px;background:#f6efe2;font-size:21px;font-weight:800;color:var(--tx);border:2px solid var(--line);transition:transform .12s}
.tpbtn:active{transform:scale(.95);background:var(--accent);color:#fff;border-color:var(--accent)}
#pay .paycards{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.paycard{width:258px;height:280px;background:var(--card);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border:2px solid var(--line);transition:transform .14s,box-shadow .14s}
.paycard:active{transform:scale(.96)}
.paycard:hover{box-shadow:var(--shadow-l);border-color:var(--gold)}
.paycard img{width:104px;height:104px;object-fit:contain}
.paycard .emoji{font-size:92px}
.paycard .lbl{font-size:25px;font-weight:800;text-align:center;color:var(--tx)}

/* ---------- Processing / success ---------- */
#done{align-items:center;justify-content:center;text-align:center}
#done .lot{width:300px;height:300px}
#done .dtitle{font-size:44px;font-weight:900;margin-top:10px;color:var(--tx)}
#done .dsub{font-size:24px;color:var(--tx2);margin-top:14px}
#done .ono{margin-top:26px;font-size:24px;font-weight:700;color:var(--tx2);background:var(--card);padding:18px 44px;border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
#done .ono b{font-size:52px;color:var(--gold-d);display:block;margin-top:4px}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#2a1c14;color:#fff;padding:16px 28px;border-radius:999px;font-size:20px;font-weight:700;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none}
.toast.on{opacity:.96}
/* ---------- arama, klavye, seçenekler, öneri, kolay mod ---------- */
.hbtn{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;color:#fff;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.2);margin-right:10px}
.sbar{display:none;align-items:center;gap:12px;padding:12px 22px;background:#fff8e6;border-bottom:1px solid var(--line);font-size:18px;font-weight:700;color:var(--tx);flex:0 0 auto}
.sbar .sp{flex:1}.sbar .sc{color:var(--tx2);font-size:15px}
.sbar button{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:800;color:var(--tx)}
.kb{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#2a1c14;padding:12px 14px 16px;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.kb.on{transform:none}
.kbbar{display:flex;gap:10px;margin-bottom:6px}
.kbin{flex:1;background:#fff;border-radius:14px;padding:14px 18px;font-size:24px;font-weight:700;color:var(--tx);min-height:58px}
.kbin.empty:before{content:attr(data-ph);color:#b3a48f}
.kbdone{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2a1c14;font-weight:900;font-size:20px;padding:0 30px;border-radius:14px}
.kbrow{display:flex;gap:8px;justify-content:center;margin-top:8px}
.kbrow button{flex:1;max-width:84px;height:62px;border-radius:12px;background:#4a3a2e;color:#fff;font-size:24px;font-weight:800}
.kbrow button:active{background:var(--gold);color:#2a1c14}
.kbrow .w2{max-width:170px;flex:2}.kbrow .w6{max-width:540px;flex:6}
.pdimgw{width:100%;height:300px;background:linear-gradient(135deg,#f6ecd9,#ecdcb8)}
.pph.big{font-size:130px}
.optg{margin-top:20px}
.optt{font-size:18px;font-weight:900;color:var(--tx);margin-bottom:10px}
.optt .req{font-size:12.5px;background:#fde2e1;color:#b42318;border-radius:999px;padding:3px 10px;margin-left:6px;font-weight:800}
.optt .optmax{font-size:13px;color:var(--tx2);font-weight:700;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:13px 20px;border-radius:999px;background:#f6efe2;border:2px solid var(--line);font-size:17px;font-weight:800;color:var(--tx)}
.chip b{color:var(--gold-d);font-weight:900}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff}
.chip.on b{color:#ffe9a8}
.notes{margin-top:22px}
.notebtn{margin-top:12px;padding:14px 20px;border-radius:14px;border:2px dashed var(--line);background:#fffaf0;font-size:17px;font-weight:700;color:var(--tx2);width:100%;text-align:left}
.crsub{font-size:14px;color:var(--tx2);font-weight:600;margin-top:4px}
#cInfo{cursor:pointer}
.cartbar.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:none}30%{transform:translateY(-6px)}60%{transform:translateY(2px)}100%{transform:none}}
.pcard.feat{border:2px solid var(--gold)}
.fbadge{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#f7dc7a,var(--gold));color:#2a1c14;font-size:13px;font-weight:900;padding:5px 11px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:10px 24px 6px}
.upc{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;text-align:center;padding-bottom:14px}
.upc.on{border-color:var(--ok)}
.upimg{height:110px;display:grid;place-items:center;font-size:56px;background:radial-gradient(circle at 50% 40%,#fff7e8 0%,#f3e3c3 70%,#ead6ad 100%)}
.upimg img{width:100%;height:100%;object-fit:cover}
.upn{font-size:17px;font-weight:800;color:var(--tx);margin-top:10px;padding:0 8px}
.upp{font-size:16px;font-weight:900;color:var(--gold-d);margin-top:4px}
.upadd{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#2a1c14;font-size:26px;font-weight:900;display:grid;place-items:center}
.upc.on .upadd{background:var(--ok);color:#fff}
/* ödeme (QR / kart terminali) */
.pobody{padding:6px 28px 4px;text-align:center}
.poamt{display:flex;align-items:baseline;justify-content:center;gap:14px;font-size:20px;color:var(--tx2);font-weight:700}
.poamt b{font-size:44px;color:var(--tx);font-weight:900}
.poqr{display:flex;justify-content:center;margin:18px auto 6px;padding:16px;background:#fff;border-radius:20px;border:2px solid var(--line);width:max-content;max-width:100%}
.poqr img,.poqr canvas{display:block}
.pocard{font-size:120px;margin:16px 0 4px;animation:tap 1.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.pomsg{font-size:21px;font-weight:700;color:var(--tx);margin-top:10px;line-height:1.4}
.pomsg .bad{color:#b42318}
.potimer{font-size:16px;color:var(--tx2);margin-top:8px;font-weight:700}
/* kolay mod: daha büyük ve sade */
body.easy .prods{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
body.easy .pimgwrap{height:200px}
body.easy .pn{font-size:22px}
body.easy .ptag{font-size:21px;padding:9px 18px}
body.easy .padd{width:62px;height:62px;font-size:40px}
body.easy .cat{min-width:160px;height:108px;font-size:18px}
body.easy .bigbtn{font-size:26px;padding:20px 46px}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="screen on" id="splash">
  <div class="slider" id="splashSlider"></div>
  <div class="langbar" id="langbar"></div>
  <div class="splashmid" id="splashMid">
    <img class="logo" id="splashLogo" style="display:none">
    <div class="biz" id="splashName">EnsariPOS</div>
  </div>
  <div class="tap" id="tapHint"><span class="hand">👆</span><span data-t="tapStart">Sipariş için dokunun</span></div>
</div>

<!-- MENU SELECT -->
<div class="screen" id="mselect">
  <div class="hd"><img class="blogo" id="ms_logo" style="display:none"><div class="bname" id="ms_name"></div></div>
  <div class="mid"><h2 data-t="chooseMenu">Menü seçin</h2><div class="cards" id="menuCards"></div></div>
</div>

<!-- ORDER TYPE -->
<div class="screen" id="otype">
  <div class="hd"><img class="blogo" id="ot_logo" style="display:none"><div class="bname" id="ot_name"></div></div>
  <div class="mid"><h2 data-t="howEat">Nasıl sipariş vermek istersiniz?</h2><div class="cards" id="otCards"></div></div>
</div>

<!-- MENU -->
<div class="screen" id="menu">
  <div class="hd">
    <img class="blogo" id="m_logo" style="display:none"><div class="bname" id="m_name"></div>
    <div class="sp"></div>
    <button class="hbtn" id="m_search">🔍 <span data-t="search">Ara</span></button>
    <button class="back" id="m_back">✕ <span data-t="cancel">İptal</span></button>
  </div>
  <div class="sbar" id="sbar"></div>
  <div class="mbody">
    <div class="cats" id="cats"></div>

    if(no){ $('doneOno').innerHTML=T('orderNo')+'<b>'+esc(no)+'</b>'; $('doneOno').style.display=''; } else $('doneOno').style.display='none'; setTimeout(resetAll,8000); }
  function showDone(icon,title,sub){ show('done'); $('doneLot').innerHTML='<div style="font-size:140px">'+icon+'</div>'; $('doneTitle').textContent=title; $('doneSub').textContent=sub||''; $('doneOno').style.display='none'; setTimeout(resetAll,15000); }
  function payIcon(o){ if(o.icon) return '<img src="'+esc(o.icon)+'">'; if(o.key==='qr') return '<div class="emoji">📱</div>'; if(o.key==='terminal') return '<img src="/assets/icons/creditcard_icon.png">'; if(o.key==='cash') return '<img src="/assets/icons/cash_icon.png">'; if(o.key==='card') return '<img src="/assets/icons/creditcard_icon.png">'; if(o.key==='wallet') return '<img src="/assets/icons/wallet.png">'; return '<div class="emoji">🧾</div>'; }
  function payLabel(o){ if(o.key==='qr'&&o.label==='QR ile Kartla Öde')return T('payQr'); if(o.key==='terminal'&&o.label==='Kartla Öde')return T('payTerminal'); if(o.key==='counter'&&o.label==='Kasada Öde')return T('payCounter'); if(o.key==='cash'&&o.label==='Nakit')return T('payCash'); if(o.key==='card'&&o.label==='Kredi Kartı')return T('payCard'); return o.label||o.key; }
  function buildPayCards(){ var opts=cfg.payOptions||[]; if(!opts.length)opts=[{key:'counter',label:'Kasada Öde'}]; $('payCards').innerHTML=opts.map(function(o){return '<button class="paycard" data-p="'+esc(o.key)+'">'+payIcon(o)+'<div class="lbl">'+esc(payLabel(o))+'</div></button>';}).join(''); }
  $('pay_back').onclick=function(){ show('menu'); };
  $('payCards').addEventListener('click',function(e){ var b=e.target.closest('[data-p]'); if(!b)return; choosePay(b.getAttribute('data-p')); });

  var lot=null;
  function playLot(file,loop){ var c=$('doneLot'); c.innerHTML=''; if(window.lottie){ try{ lot=lottie.loadAnimation({container:c,renderer:'svg',loop:!!loop,autoplay:true,path:'/assets/lotties/'+file}); return; }catch(e){} } c.innerHTML='<div style="font-size:150px">'+(file.indexOf('success')>=0?'✅':'⏳')+'</div>'; }
  function sendOrder(payType){
    show('done'); $('doneTitle').textContent=''; $('doneSub').textContent=T('sending'); $('doneOno').style.display='none'; playLot('processing_order.json',true);
    var body={ items:cart.map(function(c){return {productId:c.productId,id:c.id,quantity:c.qty,tags:(c.tags||[]).map(function(t){return {group:t.group,tag:t.tag};}),note:c.note||''};}), dest:(dest&&dest.index)||0, table:tableNo||'', payType:payType };
    fetch('/api/order',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Hata');return j;});})
      .then(function(j){ playLot('success.json',false); $('doneTitle').textContent=T('thanks'); $('doneSub').textContent=((cfg.payMode||'counter')==='counter'?T('payAtCounter'):T('received'))+(cfg.printer?'  •  🧾 '+T('takeReceipt'):''); if(j.orderNo){ $('doneOno').innerHTML=T('orderNo')+'<b>'+esc(j.orderNo)+'</b>'; $('doneOno').style.display=''; } setTimeout(resetAll, 8000); })
      .catch(function(e){ $('doneLot').innerHTML='<div style="font-size:140px">⚠️</div>'; $('doneTitle').textContent='Sipariş gönderilemedi'; $('doneSub').textContent=e.message; setTimeout(resetAll, 6000); });
  }

  function resetAll(){ stopPay(false); payId=null; closeOv('po'); cart=[]; selMenu=''; dest=null; tableNo=''; searching=false; searchQ=''; upShown=false; closeKb(); updSbar(); updateCartBar(); closeOv('pd');closeOv('cart');closeOv('kp');closeOv('tp');closeOv('up'); lang=langs[0]||'tr'; applyT(); buildLangbar(); show('splash'); }

  boot();
})();
</script>
</body>
</html>
